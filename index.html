<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Väistä Kuutioita!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: Arial, sans-serif;
            touch-action: none; /* Estää sivun skrollauksen mobiilissa */
        }

        #gameCanvas {
            display: block;
            background-color: #333;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            pointer-events: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            display: none;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="ui">Pisteet: <span id="score">0</span></div>
    
    <div id="gameOver">
        <h1>GAME OVER!</h1>
        <p>Pisteitäsi: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Pelaa uudestaan</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOver');

        // Pelin asetukset
        let score = 0;
        let isGameOver = false;
        let gameSpeed = 3;
        let spawnRate = 60; // Kuinka monen framen välein uusi kuutio tulee
        let frameCount = 0;

        // Pelaaja
        const player = {
            x: 0,
            y: 0,
            size: 30,
            color: '#00ffcc',
            targetX: 0
        };

        // Esteet
        let enemies = [];

        // Kokoa säädetään näytön mukaan
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 60;
            player.x = canvas.width / 2 - player.size / 2;
            player.targetX = player.x;
        }

        window.addEventListener('resize', resize);
        resize();

        // OHJAUKSET
        // Tietokone (Hiiri)
        window.addEventListener('mousemove', (e) => {
            player.targetX = e.clientX - player.size / 2;
        });

        // Tietokone (Näppäimistö)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') player.targetX -= 30;
            if (e.key === 'ArrowRight') player.targetX += 30;
        });

        // Mobiili (Kosketus)
        window.addEventListener('touchmove', (e) => {
            player.targetX = e.touches[0].clientX - player.size / 2;
            e.preventDefault();
        }, { passive: false });

        function spawnEnemy() {
            const size = Math.random() * (60 - 20) + 20;
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                color: '#ff4444',
                speed: Math.random() * 2 + gameSpeed
            });
        }

        function resetGame() {
            score = 0;
            gameSpeed = 3;
            enemies = [];
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            scoreElement.innerText = score;
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pelaajan liike (pehmeä seuraaminen)
            player.x += (player.targetX - player.x) * 0.2;

            // Piirrä pelaaja
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);

            // Esteiden hallinta
            frameCount++;
            if (frameCount % Math.floor(spawnRate) === 0) {
                spawnEnemy();
                // Vaikeutetaan peliä ajan myötä
                if (spawnRate > 20) spawnRate -= 0.5;
                gameSpeed += 0.01;
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                // Piirrä este
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.size, e.size);

                // Törmäyksen tarkistus
                if (
                    player.x < e.x + e.size &&
                    player.x + player.size > e.x &&
                    player.y < e.y + e.size &&
                    player.y + player.size > e.y
                ) {
                    isGameOver = true;
                    finalScoreElement.innerText = score;
                    gameOverScreen.style.display = 'block';
                }

                // Poista ruudun ulkopuolelle menneet ja lisää pisteet
                if (e.y > canvas.height) {
                    enemies.splice(i, 1);
                    score++;
                    scoreElement.innerText = score;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
